version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberlab-postgres
    restart: always
    environment:
      POSTGRES_USER: cyberlab
      POSTGRES_PASSWORD: cyberlab_secret
      POSTGRES_DB: cyberlab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cyberlab-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
